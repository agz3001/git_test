<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>carousel-slider232</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        .slider {
            position: relative;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            overflow: hidden;
        }
        .slide {
            opacity: 0;
            transition-duration: 1s ease;
        }
        .slide.active {
            opacity: 1;
            transition-duration: 1s;
            transform: scale(1.08);
        }
        .image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .left-arrow,
        .right-arrow {
            position: absolute;
            top: 50%;
            font-size: 2rem;
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            padding: 0.5rem;
            cursor: pointer;
            transform: translateY(-50%);
            z-index: 10;
        }
        .left-arrow {
            left: 25px;
        }
        .right-arrow {
            right: 25px;
        }
        .left-arrow:hover,
        .right-arrow:hover {
            background: rgba(0, 0, 0, 0.8);
        }
        .dots {
            position: absolute;
            bottom: 15px;
            display: flex;
            justify-content: center;
            width: 100%;
        }
        .dot {
            height: 15px;
            width: 15px;
            margin: 0 5px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            cursor: pointer;
            transition: background-color 0.6s ease;
        }
        .dot.active {
            background-color: #717171;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- JSXを使うため -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script type="text/babel">
        const useState = React.useState
        const useEffect = React.useEffect

        const Slider = () => {
            const slides = [
                {
                    url: 'https://via.placeholder.com/800x400.png?text=Slide+1',
                    title: 'Slide 1',
                },
                {
                    url: 'https://via.placeholder.com/800x400.png?text=Slide+2',
                    title: 'Slide 2',
                },
                {
                    url: 'https://via.placeholder.com/800x400.png?text=Slide+3',
                    title: 'Slide 3',
                },
            ];

            const [current, setCurrent] = useState(0);
            // ステート(current)の変更を監視して処理を実行
            useEffect(() => {
                const timer = setInterval(() => {
                nextSlide();
                }, 3000);

                return () => clearInterval(timer);
            }, [current]);

            const nextSlide = () => {
                setCurrent(current === slides.length - 1 ? 0 : current + 1);
            };
            const prevSlide = () => {
                setCurrent(current === 0 ? slides.length - 1 : current - 1);
            };
            const goToSlide = (index) => {
                setCurrent(index);
            };
            if (!Array.isArray(slides) || slides.length <= 0) {
                return null;
            }

            return (
                <section className="slider">
                    <button className="left-arrow" onClick={prevSlide}>←</button>
                    <button className="right-arrow" onClick={nextSlide}>→</button>
                    {slides.map((slide, index) => (
                        <div
                            className={index === current ? 'slide active' : 'slide'}
                            key={index}
                        >
                            {index === current && <img src={slide.url} className="image" />}
                        </div>
                    ))}
                    <div className="dots">
                        {slides.map((_, index) => (
                        <span
                            key={index}
                            className={index === current ? 'dot active' : 'dot'}
                            onClick={() => goToSlide(index)}
                        ></span>
                        ))}
                    </div>
                </section>
            );
        };

        const app = document.querySelector("#app")
        const root = ReactDOM.createRoot(app)
        root.render(<Slider/>)
    </script>
</body>
</html>
