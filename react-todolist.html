<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>todoList2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div id="app"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- JSXを使うため -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script type="text/babel">
        const useState = React.useState
        const useEffect = React.useEffect

        const TodoList = () => {
            // タスクのリストを管理する状態
            const [todos, setTodos] = useState([]);
            // 新しいタスクのテキストを管理する状態
            const [input, setInput] = useState('');
            // create
            const addTodo = () => {
                if (input.trim() !== '') {
                    setTodos([...todos, input]);
                    setInput('');
                }
            };
            // delete
            const removeTodo = (index) => {
                // setTodos(todos.filter((_, i) => i !== index));
                const newTodos = [...todos]
                newTodos.splice(index, 1)
                setTodos(newTodos)
            };
            // update
            const updateTodo = (index) => {
                if (input.trim() == "") return;
                // const newTodo = todos.map((todo, i) => (i === index ? input : todo));
                const newTodos = [...todos];
                newTodos[index] = input
                setTodos(newTodos)
                setInput("")
            };
            // style
            const styles = {
                container: {
                    textAlign: "center",
                    marginTop: "50px"
                },
                list: {
                    listStyleType: "none",
                },
            };

            return (
                <div style={styles.container}>
                    <h1>ToDoリスト2</h1>
                    <input
                        type="text"
                        value={input}
                        onChange={(e) => setInput(e.target.value)}
                    />
                    <button onClick={() => addTodo()}>追加</button>
                    <ul>
                        {todos.map((todo, index) => (
                        <li key={index} style={styles.list}>
                            {todo}
                            <button onClick={() => removeTodo(index)}>削除</button>
                            <button onClick={() => updateTodo(index)}>更新</button>
                        </li>
                        ))}
                    </ul>
                </div>
            );
        }

        const app = document.querySelector("#app")
        const root = ReactDOM.createRoot(app)
        root.render(<TodoList/>)
    </script>
</body>
</html>
